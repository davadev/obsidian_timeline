name: Release

# Tag-driven: pushing a SemVer tag is the only way anything is published.
#   0.10.0          -> stable release, marked latest
#   0.10.0-beta.1   -> prerelease for BRAT testers; the default branch is
#                      never touched and keeps advertising the current stable
# See docs/releasing.md.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Suffixed tags only. Keeps the committed manifest on the current stable
      # version while the uploaded assets carry the beta version.
      - name: Stamp prerelease version
        if: contains(github.ref_name, '-')
        run: node scripts/stamp-prerelease.mjs "${GITHUB_REF_NAME}"

      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run check-release -- --tag "${GITHUB_REF_NAME}"

      # Bytes on disk, immediately before anything becomes public.
      - name: Validate release artifacts
        run: |
          set -euo pipefail
          for f in main.js manifest.json styles.css; do
            [ -s "$f" ] || { echo "::error::missing or empty $f"; exit 1; }
          done
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "${GITHUB_REF_NAME}" ] || {
            echo "::error::asset manifest $v != tag ${GITHUB_REF_NAME}"; exit 1; }

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == *-* ]]; then
            flag=--prerelease
          else
            flag=--latest
          fi
          gh release create "$tag" --title "$tag" --generate-notes "$flag" \
            main.js manifest.json styles.css
